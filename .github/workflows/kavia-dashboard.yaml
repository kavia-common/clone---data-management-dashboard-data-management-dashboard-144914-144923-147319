name: Deploy to AWS

on:
  push:
    branches:
      - kavia-main

env:
  DUPLO_TOKEN: ${{ secrets.DUPLO_TOKEN }}
  DUPLO_HOST: https://duplo.cloud.kavia.ai
  DUPLO_TENANT: kavia-dev
  REPO_NAME: kavia-dashboard
  AWS_ACCOUNT_ID: 127214169382
  AWS_REGION: us-west-2
  IMAGE_NAME: kavia-dashboard
  CLUSTER_NAME: dev
  SERVICE_NAME: kavia-dashboard

jobs:
  build:  
    runs-on: ubuntu-latest
    timeout-minutes: 20
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Duplo Setup
      uses: duplocloud/actions/setup@v0.0.5
      
    - name: Build and Push Docker Image
      uses: duplocloud/actions/build-image@v0.0.5
      with:
        repo: ${{ env.REPO_NAME }}
        platforms: linux/amd64
        push: true
        cache: false
        tags: |
          ${{ github.sha }}
          latest
        dockerfile: mongodb_dashboard_backend/Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: development
    timeout-minutes: 10
    
    steps:
    - name: Duplo Setup
      uses: duplocloud/actions/setup@v0.0.5
      
    - name: Update Service Image
      run: |
        IMAGE_TAG="127214169382.dkr.ecr.us-west-2.amazonaws.com/kavia-dashboard:${{ github.sha }}"
        echo "Updating service with image: ${IMAGE_TAG}"
        duploctl service update_image kavia-dashboard "${IMAGE_TAG}"
        
    - name: Verify Deployment
      run: |
        echo "✅ Deployment Summary"
        echo "===================="
        echo "Service: ${{ env.SERVICE_NAME }}"
        echo "Image: 127214169382.dkr.ecr.us-west-2.amazonaws.com/kavia-dashboard:${{ github.sha }}"
        echo "Tenant: ${{ env.DUPLO_TENANT }}"
        echo "Cluster: ${{ env.CLUSTER_NAME }}"
        echo "===================="
