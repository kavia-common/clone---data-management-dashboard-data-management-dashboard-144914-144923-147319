name: Deploy to AWS

on:
  push:
    branches:
      - kavia-main

env:
  DUPLO_TOKEN: ${{ secrets.DUPLO_TOKEN }}
  DUPLO_HOST: https://duplo.cloud.kavia.ai
  DUPLO_TENANT: kavia-dev
  REPO_NAME: kavia-dashboard
  AWS_ACCOUNT_ID: 127214169382
  AWS_REGION: us-west-2
  IMAGE_NAME: kavia-dashboard
  CLUSTER_NAME: dev
  SERVICE_NAME: kavia-dashboard

jobs:
  build:  
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      backend_image: ${{ steps.build-and-push-backend.outputs.image }}:${{ github.sha }}
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Duplo Setup
      uses: duplocloud/actions/setup@v0.0.5

    - name: Build and Push Docker Image
      uses: duplocloud/actions/build-image@v0.0.5
      id: build-and-push-backend
      with:
        repo: ${{ env.REPO_NAME }}
        platforms: linux/amd64
        push: true
        cache: false
        tags: |
          ${{ github.sha }}
          latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: development
    timeout-minutes: 10
    
    steps:
    - name: Duplo Setup
      uses: duplocloud/actions/setup@v0.0.5

    - name: Update Service Image
      uses: duplocloud/actions/update-image@v0.0.5
      with:
        name: ${{ env.SERVICE_NAME }}
        image: ${{ needs.build.outputs.backend_image }}
        
    - name: Verify Deployment
      run: |
        echo "✅ Deployment Summary"
        echo "===================="
        echo "Service: ${{ env.SERVICE_NAME }}"
        echo "Image: ${{ needs.build.outputs.backend_image }}"
        echo "Tenant: ${{ env.DUPLO_TENANT }}"
        echo "Cluster: ${{ env.CLUSTER_NAME }}"
        echo "===================="
